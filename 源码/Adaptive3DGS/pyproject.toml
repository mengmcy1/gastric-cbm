[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive3dgs"
version = "0.1.0"
description = "Replaceable providers and canonical layer bundles for shallow 3D synthesis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
evaluation = ["h5py>=3.8"]
training = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
